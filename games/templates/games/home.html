<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameHub</title>
</head>
<body>

    <h1>GameHub</h1>
    <h2>Games</h2>

    {% for game in games %}
        <div>
        <h3>{{ game.title }}</h3>

        <p>Developer: {{ game.developer }}</p>
        <p>Rating: {{ game.rating }}</p>
        <p>Release date: {{ game.release_date }}</p>
    </div>
    {% endfor %}

</body>
</html>
