{% extends "games/base.html" %}

{% block content %}

<section class="form-page">

    <h1>Add a New Game</h1>

    <form method="POST">
        {% csrf_token %}
        {{ form.non_field_errors }}

        {% for field in form %}
            <div class="form-field">
                {{ field.label_tag }}
                {{ field }}
                {{ field.errors }}
            </div>
        {% endfor %}

        <button type="submit">Add Game</button>
    </form>

    <a href="{% url 'game_list' %}">← Back to games</a>

</section>

{% endblock %}
